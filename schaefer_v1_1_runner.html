<!doctype html><meta charset="utf-8"><title>Schaefer Reconstruction v1.1</title>
<style>body{font-family:system-ui;max-width:1100px;margin:32px auto;padding:0 16px}pre{white-space:pre-wrap;background:#f5f5f5;padding:16px;border-radius:10px}button{padding:10px 16px}</style>
<h1>Schaefer Reconstruction v1.1 — Observation 186</h1>
<p>This runner loads Astronomy Engine from jsDelivr and the Schaefer core from this repository.</p>
<button onclick="run()">Run benchmark</button><pre id="out">Ready.</pre>
<script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js"></script>
<script src="./schaefer_reconstruction_v1_1.js"></script>
<script>
function run(){try{if(!window.Astronomy)throw Error('Astronomy Engine failed to load');if(!window.SchaeferV1)throw Error('Schaefer core failed to load');const r=SchaeferV1.observation186();const compact={sunset:r.sunset,moonset:r.moonset,lagMin:r.lagMin,first:r.first,best:r.best,rows:r.rows.filter((_,i)=>i%5===0).map(x=>({time:x.date,min:x.minutesFromSunset,hSun:x.sun.altitude,hMoon:x.moon.altitude,ARCL:x.arcl,Bsky:x.sky.Bsky,dm:x.ext.deltaMag,V:x.vis.V,zeta:x.vis.zetaArcmin,branch:x.vis.branch}))};out.textContent=JSON.stringify(compact,null,2)}catch(e){out.textContent=e.stack||e}}
</script>
