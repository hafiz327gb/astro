name: Schaefer Local Strip Diagnostic
on:
  push:
    paths:
      - 'schaefer_local_strip_v1.js'
      - 'benchmark_local_strip.js'
      - '.github/workflows/schaefer-local-strip.yml'
  workflow_dispatch:
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --ignore-scripts
      - run: node benchmark_local_strip.js
      - uses: actions/upload-artifact@v4
        with:
          name: local-strip-result
          path: local_strip_result.json
