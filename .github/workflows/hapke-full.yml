name: Hapke Full Sensitivity
on:
  push:
    paths: ['hapke_full_v1.js','benchmark_hapke_full.js','.github/workflows/hapke-full.yml']
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: node benchmark_hapke_full.js
      - uses: actions/upload-artifact@v4
        with: {name: hapke-full-sensitivity, path: hapke_full_sensitivity.json}
